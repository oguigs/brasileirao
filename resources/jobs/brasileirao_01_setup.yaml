resources:
  jobs:
    brasileirao_01_setup:
      name: brasileirao_01_setup
      description: Cria schemas, volume e copia os arquivos de dados para o volume.
        Rode uma vez antes de tudo.

      git_source:
        git_url: https://github.com/oguigs/brasileirao
        git_provider: gitHub
        git_branch: main

      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: src/notebooks/00_setup
            source: GIT

      tags:
        aula: lakeflow-jobs

      queue:
        enabled: true

      parameters:
        - name: catalogo
          default: workspace
        - name: prefixo
          default: brasileirao
        - name: copiar_exemplos
          default: "false"