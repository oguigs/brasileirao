resources:
  jobs:
    brasileirao_02_historico:
      name: brasileirao_02_historico
      description: Backfill das temporadas, treino do modelo, backtest, simulação e
        tabela final.

      # Todas as tasks leem do GitHub (source: GIT).
      # notebook_path = caminho relativo à raiz do repo, SEM ".py" e SEM URL.
      git_source:
        git_url: https://github.com/oguigs/brasileirao
        git_provider: gitHub
        git_branch: main

      tasks:
        - task_key: listar_temporadas
          notebook_task:
            notebook_path: src/notebooks/10_listar_temporadas  # TODO: confirme o nome do notebook
            source: GIT

        - task_key: carregar_temporadas
          depends_on:
            - task_key: listar_temporadas
          for_each_task:
            inputs: "{{tasks.listar_temporadas.values.temporadas}}"
            concurrency: 4
            task:
              task_key: carregar_temporada
              notebook_task:
                notebook_path: src/notebooks/11_carregar_temporada  # TODO: confirme o nome do notebook
                base_parameters:
                  temporada: "{{input}}"
                source: GIT
              max_retries: 2
              min_retry_interval_millis: 30000

        - task_key: silver_partidas
          depends_on:
            - task_key: carregar_temporadas
          notebook_task:
            notebook_path: src/notebooks/20_silver_partidas
            base_parameters:
              modo: full
            source: GIT

        - task_key: backtest
          depends_on:
            - task_key: silver_partidas
          notebook_task:
            notebook_path: src/notebooks/31_backtest
            base_parameters:
              temporadas_teste: 2024,2025
            source: GIT
          timeout_seconds: 1800

        - task_key: silver_calendario
          depends_on:
            - task_key: silver_partidas
          notebook_task:
            notebook_path: src/notebooks/21_silver_calendario
            source: GIT

        - task_key: gold_classificacao
          depends_on:
            - task_key: silver_calendario
          notebook_task:
            notebook_path: src/notebooks/22_gold_classificacao
            source: GIT

        - task_key: limites_matematicos
          depends_on:
            - task_key: gold_classificacao
          notebook_task:
            notebook_path: src/notebooks/42_extremos
            source: GIT

        - task_key: treinar_modelo
          depends_on:
            - task_key: gold_classificacao
          notebook_task:
            notebook_path: src/notebooks/30_treinar_modelo
            source: GIT

        - task_key: prob_jogos
          depends_on:
            - task_key: treinar_modelo
          notebook_task:
            notebook_path: src/notebooks/40_prob_jogos
            source: GIT

        - task_key: simular
          depends_on:
            - task_key: prob_jogos
          notebook_task:
            notebook_path: src/notebooks/41_simular
            source: GIT

        - task_key: publicar_tabela_final
          depends_on:
            - task_key: simular
            - task_key: limites_matematicos
          notebook_task:
            notebook_path: src/notebooks/50_publicar_tabela_final
            source: GIT

        - task_key: qualidade
          depends_on:
            - task_key: publicar_tabela_final
          notebook_task:
            notebook_path: src/notebooks/60_qualidade
            source: GIT

        - task_key: registrar_execucao
          depends_on:
            - task_key: qualidade
            - task_key: backtest
          run_if: ALL_DONE
          notebook_task:
            notebook_path: src/notebooks/72_registrar_execucao
            base_parameters:
              job_nome: brasileirao_historico
              gatilho: "{{job.trigger.type}}"
              ler_valores: simular.favorito,backtest.rps_modelo,qualidade.regras_com_falha
            source: GIT

      tags:
        aula: lakeflow-jobs
        fluxo: historico

      queue:
        enabled: true

      parameters:
        - name: catalogo
          default: workspace
        - name: prefixo
          default: brasileirao
        - name: temporada_atual
          default: "2026"
        - name: temporada_inicio
          default: "2012"
        - name: temporada_fim
          default: "2026"
        - name: n_simulacoes
          default: "200000"
        - name: run_id
          default: "{{job.run_id}}"
        - name: data_ref
          default: "{{job.start_time.iso_datetime}}"

      performance_target: PERFORMANCE_OPTIMIZED