resources:
  jobs:
    brasileirao_02_historico:
      name: brasileirao_02_historico
      description: Backfill das temporadas, treino do modelo, backtest, simulação e
        tabela final.
      tasks:
        - task_key: listar_temporadas
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/10_listar_temporadas.py
            source: WORKSPACE
        - task_key: carregar_temporadas
          depends_on:
            - task_key: listar_temporadas
          for_each_task:
            inputs: "{{tasks.listar_temporadas.values.temporadas}}"
            concurrency: 4
            task:
              task_key: carregar_temporada
              notebook_task:
                notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/11_bronze_temporada.py
                base_parameters:
                  temporada: "{{input}}"
                source: WORKSPACE
              max_retries: 2
              min_retry_interval_millis: 30000
        - task_key: silver_partidas
          depends_on:
            - task_key: carregar_temporadas
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/20_silver_partidas.py
            base_parameters:
              modo: full
            source: WORKSPACE
        - task_key: backtest
          depends_on:
            - task_key: silver_partidas
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/31_backtest.py
            base_parameters:
              temporadas_teste: 2024,2025
            source: WORKSPACE
          timeout_seconds: 1800
        - task_key: silver_calendario
          depends_on:
            - task_key: silver_partidas
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/21_silver_calendario.py
            source: WORKSPACE
        - task_key: gold_classificacao
          depends_on:
            - task_key: silver_calendario
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/22_gold_classificacao.py
            source: WORKSPACE
        - task_key: limites_matematicos
          depends_on:
            - task_key: gold_classificacao
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/42_extremos.py
            source: WORKSPACE
        - task_key: treinar_modelo
          depends_on:
            - task_key: gold_classificacao
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/30_treinar_modelo.py
            source: WORKSPACE
        - task_key: prob_jogos
          depends_on:
            - task_key: treinar_modelo
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/40_prob_jogos.py
            source: WORKSPACE
        - task_key: simular
          depends_on:
            - task_key: prob_jogos
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/41_simular.py
            source: WORKSPACE
        - task_key: publicar_tabela_final
          depends_on:
            - task_key: simular
            - task_key: limites_matematicos
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/50_publicar_tabela_final.py
            source: WORKSPACE
        - task_key: qualidade
          depends_on:
            - task_key: publicar_tabela_final
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/60_qualidade.py
            source: WORKSPACE
        - task_key: registrar_execucao
          depends_on:
            - task_key: qualidade
            - task_key: backtest
          run_if: ALL_DONE
          notebook_task:
            notebook_path: /Workspace/Users/guilherme.carmo.gomes@gmail.com/brasileirao/src/notebooks/72_registrar_execucao.py
            base_parameters:
              job_nome: brasileirao_historico
              gatilho: "{{job.trigger.type}}"
              ler_valores: simular.favorito,backtest.rps_modelo,qualidade.regras_com_falha
            source: WORKSPACE
      tags:
        aula: lakeflow-jobs
        fluxo: historico
      queue:
        enabled: true
      parameters:
        - name: catalogo
          default: workspace
        - name: prefixo
          default: brasileirao
        - name: temporada_atual
          default: "2026"
        - name: temporada_inicio
          default: "2012"
        - name: temporada_fim
          default: "2026"
        - name: n_simulacoes
          default: "200000"
        - name: run_id
          default: "{{job.run_id}}"
        - name: data_ref
          default: "{{job.start_time.iso_datetime}}"
      performance_target: PERFORMANCE_OPTIMIZED
