resources:
  jobs:
    brasileirao_03_incremental:
      name: brasileirao_03_incremental
      description: Ingere resultados novos, valida, atualiza a silver e recalcula as
        chances e a tabela final.

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/brasileirao_bronze/landing/resultados/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60

      tasks:
        - task_key: ingerir_resultados
          notebook_task:
            notebook_path: ../../src/notebooks/70_ingerir_resultados.py
            base_parameters:
              local_gatilho: "{{job.trigger.file_arrival.location}}"
          max_retries: 2
          min_retry_interval_millis: 30000

        - task_key: validar_lote
          depends_on:
            - task_key: ingerir_resultados
          notebook_task:
            notebook_path: ../../src/notebooks/71_validar_lote.py

        - task_key: tem_novidade
          depends_on:
            - task_key: validar_lote
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.validar_lote.values.n_novos}}"
            right: "0"

        - task_key: atualizar_silver
          depends_on:
            - task_key: tem_novidade
              outcome: "true"
          notebook_task:
            notebook_path: ../../src/notebooks/20_silver_partidas.py
            base_parameters:
              modo: incremental

        - task_key: gold_classificacao
          depends_on:
            - task_key: atualizar_silver
          notebook_task:
            notebook_path: ../../src/notebooks/22_gold_classificacao.py

        - task_key: limites_matematicos
          depends_on:
            - task_key: gold_classificacao
          notebook_task:
            notebook_path: ../../src/notebooks/42_extremos.py

        - task_key: treinar_modelo
          depends_on:
            - task_key: gold_classificacao
          notebook_task:
            notebook_path: ../../src/notebooks/30_treinar_modelo.py

        - task_key: prob_jogos
          depends_on:
            - task_key: treinar_modelo
          notebook_task:
            notebook_path: ../../src/notebooks/40_prob_jogos.py

        - task_key: simular
          depends_on:
            - task_key: prob_jogos
          notebook_task:
            notebook_path: ../../src/notebooks/41_simular.py

        - task_key: publicar_tabela_final
          depends_on:
            - task_key: simular
            - task_key: limites_matematicos
          notebook_task:
            notebook_path: ../../src/notebooks/50_publicar_tabela_final.py

        - task_key: qualidade
          depends_on:
            - task_key: publicar_tabela_final
          notebook_task:
            notebook_path: ../../src/notebooks/60_qualidade.py

        - task_key: registrar_execucao
          depends_on:
            - task_key: qualidade
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../../src/notebooks/72_registrar_execucao.py
            base_parameters:
              job_nome: brasileirao_incremental
              gatilho: "{{job.trigger.type}}"
              ler_valores: validar_lote.n_novos,validar_lote.n_invalidos,simular.favorito,qualidade.regras_com_falha

        - task_key: registrar_sem_novidade
          depends_on:
            - task_key: tem_novidade
              outcome: "false"
          notebook_task:
            notebook_path: ../../src/notebooks/72_registrar_execucao.py
            base_parameters:
              job_nome: brasileirao_incremental
              gatilho: "{{job.trigger.type}}"
              status: sem_novidade
              ler_valores: validar_lote.n_novos,validar_lote.n_invalidos

      tags:
        aula: lakeflow-jobs
        fluxo: incremental

      queue:
        enabled: true

      parameters:
        - name: catalogo
          default: workspace
        - name: prefixo
          default: brasileirao
        - name: temporada_atual
          default: "2026"
        - name: n_simulacoes
          default: "200000"
        - name: run_id
          default: "{{job.run_id}}"
        - name: data_ref
          default: "{{job.start_time.iso_datetime}}"

      performance_target: PERFORMANCE_OPTIMIZED
